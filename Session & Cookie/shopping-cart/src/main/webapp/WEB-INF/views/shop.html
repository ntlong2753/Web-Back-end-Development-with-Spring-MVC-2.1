<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
</head>
<body>
<a href="/shopping-cart">🛍️ Your Cart</a>
<h1>Product List</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Add To Cart</th>
    </tr>
    <th:block th:each="product : ${products}">
        <tr>
            <td th:text="${product.name}"></td>
            <td th:text="${#numbers.formatDecimal(product.price, 0, 0)} + ' đ'"></td>
            <td>
                <a class="button" th:href="@{/add/__${product.id}__(action='list')}">Add to Cart</a>
            </td>
        </tr>
    </th:block>
</table>
</body>
</html>
