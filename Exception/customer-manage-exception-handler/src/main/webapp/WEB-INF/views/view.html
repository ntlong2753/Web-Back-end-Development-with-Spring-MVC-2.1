<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Khách Hàng</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h3>Chi Tiết Khách Hàng</h3>
    
    <div class="detail-card">
        <div class="detail-item">
            <span class="detail-label">ID:</span>
            <span class="detail-value" th:text="${customer.id}"></span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Tên:</span>
            <span class="detail-value" th:text="${customer.name}"></span>
        </div>
        <div class="detail-item">
            <span class="detail-label">Email:</span>
            <span class="detail-value" th:text="${customer.email}"></span>
        </div>
    </div>
    
    <div class="form-actions">
        <a th:href="@{/customers}" class="btn btn-back">Quay lại danh sách</a>
        <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-submit" style="text-align: center; display: inline-block;">Chỉnh sửa</a>
    </div>
</div>
</body>
</html>
