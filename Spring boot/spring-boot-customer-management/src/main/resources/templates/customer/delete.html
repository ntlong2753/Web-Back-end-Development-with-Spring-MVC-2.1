<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --danger-gradient: linear-gradient(90deg, #f857a6 0%, #ff5858 100%);
            --danger-hover: linear-gradient(90deg, #e03e8c 0%, #e63e3e 100%);
            --danger-glow: rgba(255, 88, 88, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #4158D0, #C850C0, #FFCC70, #4facfe);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-width: 450px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ff5858, #C850C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            color: #e11d48; /* Rose red */
            margin-bottom: 15px;
        }

        .container > a {
            display: block;
            text-align: center;
            text-decoration: none !important;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            transition: color 0.3s ease;
        }

        .container > a:hover {
            color: #C850C0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
        }

        td {
            padding: 16px 20px;
            vertical-align: middle;
        }

        tr:not(:last-child) {
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        td:first-child {
            width: 40%;
            font-size: 15px;
            font-weight: 600;
            color: #475569;
        }

        td:last-child {
            width: 60%;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            word-break: break-word;
        }

        input[type="submit"] {
            width: 100%;
            background: var(--danger-gradient);
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--danger-glow);
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 88, 88, 0.5);
            background: var(--danger-hover);
        }

        input[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px var(--danger-glow);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Delete Customer</h1>
    <h2>Are you sure?</h2>
    <a href="/customers">← Back to Customer List</a>
    <form th:action="@{/customers/delete}" th:object="${customer}" method="post">
        <!-- Giữ nguyên input id ẩn để chạy đúng logic xóa của bạn -->
        <input type="hidden" name="id" th:field="*{id}">
        <table>
            <tr>
                <td>First name:</td>
                <td th:text="${customer.firstName}"></td>
            </tr>
            <tr>
                <td>Last name:</td>
                <td th:text="${customer.lastName}"></td>
            </tr>
        </table>
        <input type="submit" value="Delete Customer">
    </form>
</div>
</body>
</html>
