<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --input-border: #e2e8f0;
            --input-focus: #C850C0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #4158D0, #C850C0, #FFCC70, #4facfe);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-width: 450px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to right, #4158D0, #C850C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        a {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #C850C0;
            text-decoration: underline;
        }

        .message {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            color: #1e4620;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(150, 230, 161, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px 0;
            vertical-align: middle;
        }

        td:first-child {
            width: 30%;
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        td:last-child {
            width: 70%;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(200, 80, 192, 0.15);
        }

        input[type="submit"] {
            width: 100%;
            background: linear-gradient(90deg, #4158D0 0%, #C850C0 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(200, 80, 192, 0.3);
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(200, 80, 192, 0.4);
            background: linear-gradient(90deg, #374bb3 0%, #b043a8 100%);
        }

        input[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(200, 80, 192, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Customer</h1>
    <a href="/customers">← Back to Customer List</a>

    <th:block th:if="${message}">
        <p class="message" th:text="${message}"></p>
    </th:block>

    <form th:action="@{/customers/create}" th:object="${customer}" method="post">
        <table>
            <tr>
                <td>First name:</td>
                <td><input type="text" th:field="*{firstName}" placeholder="Enter first name" /></td>
            </tr>
            <tr>
                <td>Last name:</td>
                <td><input type="text" th:field="*{lastName}" placeholder="Enter last name" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Create Customer"></td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
